name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.11.7"
      - run: ruff check app tests scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit/E2E-mock suite (Docker 标记用例除外)
        run: python -m pytest tests/ -q -m "not docker"
        env:
          # config.py 的四项必填：测试用 Fake，不真连 LLM
          LLM_BASE_URL: http://localhost:9/v1
          LLM_API_KEY: test-key
          CONSOLE_MODEL: test-console
          SANDBOX_MODEL: test-sandbox
